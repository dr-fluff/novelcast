[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelcast"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi==0.119.1",
    "starlette==0.48.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
    "pydantic==2.14.3",
    "schedule==1.2.2",
    "fanficfare==4.63.0",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "pydantic-settings==2.16.2",
    "itsdangerous==2.2.0",
    "pillow==13.0.0",
    "sqlalchemy==2.1.8",
    "pytest==9.2.0",
    "httpx==0.28.1",
    "lxml==6.1.3",
    "pypdf2==3.0.1",
    "alembic==1.20.1",
    "ebooklib==0.21",
    "pip-audit==2.10.1",
    "playwright==1.65.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "novelcast.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
novelcast = "novelcast.run:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
    "B",
]

ignore = [
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/novelcast/core/defaults.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

