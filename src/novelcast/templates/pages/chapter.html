<!-- novelcast/templates/pages/chapter.html -->
{% extends "layouts/base.html" %}

{% block title %}{{ title }} - {{ chapter }}{% endblock %}

{% block head %}
    <link rel="stylesheet" href="/static/css/pages/chapter.css" />
{% endblock %}

{% block content %}

<div class="reader-container" 
    data-story-id="{{ story_id }}" 
    data-chapter-id="{{ chapter_id }}"
    data-next-chapter-id="{{ next_chapter_id }}"
    data-prev-chapter-id="{{ prev_chapter_id }}"
    data-first-unread-id="{{ first_unread_chapter_id | default('') }}"
    data-chapter-title="{{ chapter | e }}"
    data-hide-author-notes="{{ hide_author_notes | lower }}">

    <!-- READER HEADER -->
    <div class="reader-header">
        <div class="header-left">
            <a href="/story?story_id={{ story_id }}" class="back-btn" title="Back to story">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
        </div>
        <div class="header-center">
            <h1>{{ title }}</h1>
        </div>
        <div class="header-right">
            <button class="settings-btn" id="settingsBtn" title="Settings">
                <i class="fa-solid fa-sliders"></i>
            </button>
        </div>
    </div>

    <!-- READER SETTINGS PANEL -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-content">
            <div class="settings-header">
                <h2>Reading Settings</h2>
                <button class="close-settings" id="closeSettings">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="settings-group">
                <label>Theme:</label>
                <div class="button-group">
                    <button class="theme-btn" data-theme="light"><i class="fa-solid fa-sun"></i> Light</button>
                    <button class="theme-btn" data-theme="sepia"><i class="fa-solid fa-book"></i> Sepia</button>
                    <button class="theme-btn" data-theme="dark"><i class="fa-solid fa-moon"></i> Dark</button>
                </div>
            </div>

            <div class="settings-group">
                <label>Font Family:</label>
                <div class="button-group">
                    <button class="font-family-btn" data-font="sans">Sans</button>
                    <button class="font-family-btn" data-font="serif">Serif</button>
                </div>
            </div>

            <div class="settings-group">
                <label>Font Size:</label>
                <div class="button-group">
                    <button class="font-size-btn" data-size="75">12</button>
                    <button class="font-size-btn" data-size="88">14</button>
                    <button class="font-size-btn" data-size="100">16</button>
                    <button class="font-size-btn" data-size="113">18</button>
                    <button class="font-size-btn" data-size="125">20</button>
                    <button class="font-size-btn" data-size="150">24</button>
                    <button class="font-size-btn" data-size="225">36</button>
                </div>
                <div class="slider-value" id="fontSizeValue">16</div>
            </div>

            <div class="settings-group">
                <label>Line Spacing:</label>
                <div class="slider-container">
                    <span class="slider-min">−</span>
                    <input type="range" id="lineSpacingSlider" class="slider" min="50" max="150" value="100">
                    <span class="slider-max">+</span>
                </div>
                <div class="slider-value" id="lineSpacingValue">100%</div>
            </div>

            <div class="settings-group">
                <label>Font Weight:</label>
                <div class="button-group">
                    <button class="font-weight-btn" data-weight="0">Light</button>
                    <button class="font-weight-btn" data-weight="1">Normal</button>
                    <button class="font-weight-btn" data-weight="2">Bold</button>
                </div>
            </div>

            <div class="settings-group">
                <label>Paragraph Spacing:</label>
                <div class="slider-container">
                    <span class="slider-min">−</span>
                    <input type="range" id="paragraphSpacingSlider" class="slider" min="0" max="200" value="100">
                    <span class="slider-max">+</span>
                </div>
                <div class="slider-value" id="paragraphSpacingValue">100%</div>
            </div>
        </div>
    </div>

    <!-- SETTINGS OVERLAY -->
    <div class="settings-overlay" id="settingsOverlay"></div>

    <!-- IFRAME MOUNT POINT — JS replaces this with an iframe -->
    <div class="chapter-scroll-container" id="chapterScroll" style="position: relative; align-items: stretch;">
        <!-- Hidden source content — JS reads this, then hides it -->
        <div class="chapter-text" id="chapterSource" style="display:none;">
            {{ content | safe }}
        </div>
    </div>

    <!-- FLOATING NAVIGATION ARROWS -->
    <div class="floating-nav">
        <button class="nav-arrow prev-chapter" id="prevChapter">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="nav-arrow next-chapter" id="nextChapterFloating">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <script src="/static/js/chapter_paginated.js" defer></script>
{% endblock %}
