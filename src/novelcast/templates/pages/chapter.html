<!-- novelcast/templates/pages/chapter.html -->
{% extends "layouts/base.html" %} {% block title %}{{ title }} - {{ chapter }}{% endblock %}
{% block head %}
    <link rel="stylesheet" href="/static/css/pages/chapter.css" />
{% endblock %}
{% block content %}
    <div
        class="reader-container"
        data-story-id="{{ story_id }}"
        data-chapter-id="{{ chapter_id }}"
        data-next-chapter-id="{{ next_chapter_id }}"
        data-prev-chapter-id="{{ prev_chapter_id }}"
        data-upcoming-chapter-ids="{{ upcoming_chapter_ids | tojson | e }}"
        data-first-unread-id="{{ first_unread_chapter_id | default('') }}"
        data-chapter-title="{{ chapter | e }}"
        data-hide-author-notes="{{ hide_author_notes | lower }}"
    >
        <!-- READER HEADER -->
        <div class="reader-header">
            <div class="header-left">
                <a href="/story?story_id={{ story_id }}" class="back-btn" title="Back to story">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
            </div>
            <div class="header-center">
                <h1>{{ title }}</h1>
            </div>
            <div class="header-right">
                <button class="settings-btn" id="settingsBtn" title="Settings">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </div>
        </div>

        <!-- READER SETTINGS PANEL -->
        <!-- Fields are rendered by chapter_paginated.js from the schema below,
        mirroring how settings.html renders server settings from `schema`. -->
        <div class="settings-panel" id="settingsPanel" data-reading-schema="{{ reading_settings_schema | tojson | e }}">
            <div class="settings-content">
                <div class="settings-header">
                    <h2>Reading Settings</h2>
                    <button class="close-settings" id="closeSettings">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div id="settingsFields"></div>
            </div>
        </div>

        <!-- SETTINGS OVERLAY -->
        <div class="settings-overlay" id="settingsOverlay"></div>

        <!-- IFRAME MOUNT POINT — JS replaces this with an iframe -->
        <div class="chapter-scroll-container" id="chapterScroll" style="position: relative; align-items: stretch">
            <!-- Hidden source content — JS reads this, then hides it -->
            <div class="chapter-text" id="chapterSource" style="display: none">{{ content | safe }}</div>
        </div>

        <!-- FLOATING NAVIGATION ARROWS -->
        <div class="floating-nav">
            <button class="nav-arrow prev-chapter" id="prevChapter">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button class="nav-arrow next-chapter" id="nextChapterFloating">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>
{% endblock %}
{% block scripts %}
    <script src="/static/js/chapter_paginated.js" defer></script>
{% endblock %}
