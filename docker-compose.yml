services:
    novelcast:
        build: .
        ports:
            - '8000:8000'
        env_file:
            - .env
        environment:
            ENV: production
            DEBUG: 'false'
            HOST: 0.0.0.0
            RELOAD: 'false'
            PORT: 8000
            DATABASE_URL: sqlite:///data/novelcast.db
        volumes:
            - ./data:/app/data
            - ./logs:/app/logs
            - ./config:/app/config
        restart: unless-stopped
